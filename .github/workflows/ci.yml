name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (repo scripts)
        run: |
          shellcheck --severity=error \
            link.sh link-skills.sh common.sh .bashrc \
            githooks/pre-commit claude/hooks/auto-commit.sh
      - name: shellcheck (bin scripts)
        run: |
          git grep -lE '^#!/(usr/)?bin/(env )?(bash|sh)\b' -- bin \
            | xargs shellcheck --severity=error

  link-idempotency:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: link checkout as ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"
      - name: run link.sh (1st)
        run: ./link.sh
      - name: run link.sh (2nd, must be idempotent)
        run: ./link.sh
      - name: verify links resolve
        run: |
          for f in ~/.zshrc ~/.tmux.conf ~/.config/nvim/init.lua \
                   ~/.claude/settings.json ~/.claude/CLAUDE.md; do
            [ -e "$f" ] || { echo "broken link: $f" >&2; exit 1; }
          done
      - name: verify hooksPath is configured
        run: |
          [ "$(git -C "$HOME/dotfiles" config core.hooksPath)" = "githooks" ]

  # 検知線: pre-commit すり抜け時に漏洩へ早期に気づきローテーションを起動する。
  # 防止線は githooks/pre-commit (gitleaks protect --staged)。
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: gitleaks (full history)
        run: gitleaks detect --redact -v
