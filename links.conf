# symlink 宣言表: <repo 内の相対 src>\t<リンク先 dst>
# link.sh がこの表を読んで ln -sfn する。dst の親ディレクトリは自動作成。
# 行頭 # とタブなし行は無視。dst の ~ と $HOME は展開される。
.tool-versions	~/.tool-versions
.vimrc	~/.vimrc
.zshrc	~/.zshrc
.bashrc	~/.bashrc
.tmux.conf	~/.tmux.conf
starship.toml	~/.config/starship.toml
sheldon/plugins.toml	~/.config/sheldon/plugins.toml
.config/karabiner/karabiner.json	~/.config/karabiner/karabiner.json
.gitconfig	~/.gitconfig
alacritty/alacritty.toml	~/.alacritty.toml
nvim	~/.config/nvim
# agmsg の既存 command/hook 用 runtime。SKILL.md は公開しない。
skills/agmsg/.agmsg	~/.agents/skills/agmsg/.agmsg
skills/agmsg/agents	~/.agents/skills/agmsg/agents
skills/agmsg/db	~/.agents/skills/agmsg/db
skills/agmsg/plugins	~/.agents/skills/agmsg/plugins
skills/agmsg/run	~/.agents/skills/agmsg/run
skills/agmsg/scripts	~/.agents/skills/agmsg/scripts
skills/agmsg/teams	~/.agents/skills/agmsg/teams
skills/agmsg/types	~/.agents/skills/agmsg/types
skills/agmsg/uninstall.sh	~/.agents/skills/agmsg/uninstall.sh
skills/agmsg/VERSION	~/.agents/skills/agmsg/VERSION
claude/settings.json	~/.claude/settings.json
claude/skills	~/.claude/skills
claude/agents	~/.claude/agents
claude/commands	~/.claude/commands
claude/CLAUDE.md	~/.claude/CLAUDE.md
codex/AGENTS.md	~/.codex/AGENTS.md
codex/skills	~/.codex/skills
.gitignore_global	~/.config/git/ignore
.config/lazygit/config.yml	~/Library/Application Support/lazygit/config.yml
.aerospace.toml	~/.aerospace.toml
.hammerspoon/init.lua	~/.hammerspoon/init.lua
.hammerspoon/modules	~/.hammerspoon/modules
ghostty	~/.config/ghostty/config
.config/herdr/config.toml	~/.config/herdr/config.toml
alacritty/catppuccin-frappe.toml	~/.config/alacritty/catppuccin-frappe.toml
